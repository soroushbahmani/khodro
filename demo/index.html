<!doctype html>
<html lang="fa" dir="rtl" data-theme="khodro">
<head>

<title>دموی سامانه خودروگرافی</title>
<meta name="description" content="دموی کلیکی سامانه‌ی خودروگرافی: ایجنت چت، مدیریت پروژه، چک‌لیست بازدید، گزارش مشتری و حسابداری">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233b5bdb'/%3E%3Cpath d='M3 12h4l2-6 4 12 2-6h6' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preload" href="../fonts/vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
<!-- UI kit: DaisyUI 5 روی Tailwind CSS 4 (CDN، نسخه‌ی قفل‌شده) -->
<link href="https://cdn.jsdelivr.net/npm/daisyui@5.8.1/daisyui.css" rel="stylesheet" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.5/dist/index.global.js"></script>
<style>
@font-face{font-family:Vazirmatn;src:url(../fonts/vazirmatn.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
/* ---- تم‌های سفارشی روی توکن‌های DaisyUI ---- */
[data-theme="khodro"]{color-scheme:light;
 --color-base-100:#ffffff;--color-base-200:#f4f6fb;--color-base-300:#e4e9f2;--color-base-content:#0f172a;
 --color-primary:#3b5bdb;--color-primary-content:#ffffff;--color-secondary:#f59e0b;--color-secondary-content:#2b1c00;
 --color-accent:#0ea5e9;--color-accent-content:#00202e;--color-neutral:#0f1830;--color-neutral-content:#e8edff;
 --color-info:#0284c7;--color-info-content:#fff;--color-success:#16a34a;--color-success-content:#fff;
 --color-warning:#d97706;--color-warning-content:#fff;--color-error:#dc2626;--color-error-content:#fff;
 --radius-selector:1rem;--radius-field:.75rem;--radius-box:1.1rem;--size-selector:.25rem;--size-field:.25rem;--border:1px;--depth:1;--noise:0}
[data-theme="khodro-dark"]{color-scheme:dark;
 --color-base-100:#131c31;--color-base-200:#0b1220;--color-base-300:#243049;--color-base-content:#eef2ff;
 --color-primary:#8da2ff;--color-primary-content:#0b1030;--color-secondary:#fbbf24;--color-secondary-content:#2b1c00;
 --color-accent:#38bdf8;--color-accent-content:#00202e;--color-neutral:#070c18;--color-neutral-content:#e8edff;
 --color-info:#38bdf8;--color-info-content:#00202e;--color-success:#4ade80;--color-success-content:#032b12;
 --color-warning:#fbbf24;--color-warning-content:#2b1c00;--color-error:#f87171;--color-error-content:#2b0505;
 --radius-selector:1rem;--radius-field:.75rem;--radius-box:1.1rem;--size-selector:.25rem;--size-field:.25rem;--border:1px;--depth:1;--noise:0}
html{scroll-behavior:smooth}
body{font-family:Vazirmatn,"SF Arabic","Geeza Pro",Tahoma,sans-serif;line-height:1.85;-webkit-font-smoothing:antialiased;
 background:radial-gradient(600px 400px at 90% -5%,color-mix(in oklab,var(--color-primary) 14%,transparent),transparent),radial-gradient(500px 360px at 0% 100%,color-mix(in oklab,var(--color-secondary) 9%,transparent),transparent),var(--color-base-200);background-attachment:fixed}
button,input,select,textarea{font-family:inherit}
.side{background:linear-gradient(180deg,#0f1830 0%,#0a1022 100%);color:#e8edff}
.side .menu li>a{color:#cbd5e1;border-radius:.8rem;padding:.55rem .8rem;gap:.7rem}
.side .menu li>a:hover{background:rgba(255,255,255,.07)}
.side .menu li>a.menu-active{background:linear-gradient(135deg,#4f6bf0,#2f45b5);color:#fff;box-shadow:0 6px 18px rgba(79,107,240,.45)}
.side .menu-title{color:#94a3b8}
.ico{width:1.2rem;height:1.2rem;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico-lg{width:1.5rem;height:1.5rem}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop{animation:pop .3s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.lift{transition:transform .2s,box-shadow .2s}.lift:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(15,23,42,.12)}
.hero-grad{background:linear-gradient(120deg,#17266b,#3b5bdb 60%,#6c86ff);color:#fff;position:relative;overflow:hidden}
.hero-grad:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.08);inset-inline-end:-80px;top:-120px}
.hero-grad:after{content:"";position:absolute;inset-inline-end:60px;bottom:-4px;width:240px;height:6px;border-radius:9px;background:#f59e0b;transform:rotate(-8deg)}
.ch svg{display:block;width:100%;height:auto;overflow:visible}
.ch text{font-family:inherit;fill:color-mix(in oklab,var(--color-base-content) 62%,transparent);font-size:12.5px}
.ch .anim{animation:draw 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes draw{from{stroke-dashoffset:var(--c,0)}}
.ch .grow{transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box}
@keyframes grow{from{transform:scaleY(0)}}
.ch rect.grow:hover,.ch circle.pt:hover{filter:brightness(1.15)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;opacity:.75;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
.tour-hl{outline:3px solid var(--color-secondary);outline-offset:6px;border-radius:1rem;animation:hl 1.6s ease-in-out infinite;position:relative;z-index:5}
@keyframes hl{50%{outline-color:transparent;outline-offset:10px}}
.msgs{height:440px;overflow:auto;scroll-behavior:smooth}
.chat-bubble{white-space:pre-wrap;line-height:1.8}
.tri .btn{min-width:3.6rem}
.radial-progress{box-shadow:inset 0 0 0 var(--thickness) var(--color-base-300)}
.sticky-score{position:sticky;top:5.5rem}
.conf{position:fixed;top:0;width:10px;height:14px;z-index:100;pointer-events:none;border-radius:2px}
kbd{font-family:inherit}
@media print{.noprint,.side,.navbar,#tour,.toast{display:none!important}.drawer-content{display:block!important}body{background:#fff}}
</style>
</head>
<body>
<div class="drawer lg:drawer-open">
 <input id="dr" type="checkbox" class="drawer-toggle">
 <div class="drawer-content flex flex-col min-w-0">
  <div class="navbar sticky top-0 z-30 gap-2 border-b border-base-300 bg-base-100/80 px-3 backdrop-blur noprint">
   <label for="dr" class="btn btn-ghost btn-square lg:hidden" aria-label="منو"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></label>
   <button id="gs" class="btn btn-sm btn-ghost border border-base-300 flex-1 max-w-sm justify-start gap-2 font-normal opacity-80"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span class="truncate">جستجوی پرونده، مشتری، خودرو…</span><kbd class="kbd kbd-sm ms-auto hidden sm:inline-flex">/</kbd></button>
   <div class="flex-1"></div>
   <span id="rolebadge" class="badge badge-soft badge-primary hidden md:inline-flex"></span>
   <button id="tourbtn" class="btn btn-sm btn-secondary gap-1"><svg class="ico" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>تور راهنما</button>
   <label class="swap swap-rotate btn btn-ghost btn-circle btn-sm" title="تغییر تم"><input type="checkbox" id="themeTgl"><svg class="swap-on ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="swap-off ico" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></label>
  </div>
  <main id="main" class="p-4 lg:p-8 pb-28 min-w-0"></main>
 </div>
 <div class="drawer-side z-40 noprint">
  <label for="dr" aria-label="بستن" class="drawer-overlay"></label>
  <aside class="side flex min-h-full w-72 flex-col p-4">
   <div class="flex items-center gap-3 px-1">
    <div class="grid h-10 w-10 place-items-center rounded-xl" style="background:linear-gradient(135deg,#4f6bf0,#2f45b5);box-shadow:0 6px 18px rgba(79,107,240,.5)"><svg class="ico ico-lg text-white" viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg></div>
    <div><div class="text-xl font-extrabold leading-tight">خودروگرافی</div><div class="text-xs text-slate-400">دموی سامانه · ساخته‌ی پلی‌مدیا</div></div>
   </div>
   <fieldset class="fieldset mt-5"><legend class="fieldset-legend text-slate-400 text-xs">نقش کاربر (برای دمو)</legend>
    <select id="role" class="select select-sm w-full bg-white/10 border-white/15 text-white"></select></fieldset>
   <ul class="menu menu-md w-full p-0 mt-2 gap-1" id="nav"></ul>
   <ul class="menu menu-md w-full p-0 mt-2 gap-1">
    <li class="menu-title text-xs">اسناد</li>
    <li><a href="../"><svg class="ico" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>سند PRD و بررسی رقبا</a></li>
    <li><a href="../wireframe/"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>وایرفریم صفحه‌ها</a></li>
   </ul>
   <div class="mt-auto pt-6 text-xs text-slate-400">داده‌ها فقط در همین مرورگر ذخیره می‌شوند.<br><button id="reset" class="link link-hover text-rose-300">بازنشانی داده‌ی دمو</button></div>
  </aside>
 </div>
</div>

<div id="toasts" class="toast toast-top toast-start z-[60] noprint"></div>
<dialog id="modal" class="modal modal-bottom sm:modal-middle"><div class="modal-box max-w-2xl" id="mbox"></div><form method="dialog" class="modal-backdrop"><button>بستن</button></form></dialog>
<div id="tour" class="fixed bottom-4 inset-x-4 sm:inset-x-auto sm:end-4 sm:w-[24rem] z-50 hidden noprint"></div>

<script>
/* ================= helpers ================= */
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const en=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const money=n=>fa(Math.round(n).toLocaleString('en-US'));
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jdate=(d=new Date())=>{const o={};new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).formatToParts(d).forEach(x=>o[x.type]=x.value);return `${o.weekday} ${o.day} ${o.month} ${o.year}`};
function toast(m,type='success'){const t=document.createElement('div');t.className=`alert alert-${type} pop shadow-lg`;t.innerHTML=`<span>${esc(m)}</span>`;$('#toasts').appendChild(t);setTimeout(()=>{t.style.transition='.3s';t.style.opacity=0;setTimeout(()=>t.remove(),300)},2800)}
function openModal(html){$('#mbox').innerHTML=html;const d=$('#modal');if(!d.open)d.showModal()}
function closeModal(){const d=$('#modal');if(d.open)d.close()}
const mhead=(t,sub)=>`<form method="dialog"><button class="btn btn-sm btn-circle btn-ghost absolute top-3 end-3">✕</button></form><h3 class="text-lg font-bold">${t}</h3>${sub?`<p class="text-sm opacity-70">${sub}</p>`:''}`;
function confetti(){const c=['#3b5bdb','#f59e0b','#16a34a','#0ea5e9','#dc2626'];for(let i=0;i<46;i++){const e=document.createElement('i');e.className='conf';e.style.left=(20+Math.random()*60)+'vw';e.style.background=c[i%5];document.body.appendChild(e);e.animate([{transform:'translateY(-10px) rotate(0)',opacity:1},{transform:`translate(${(Math.random()-.5)*300}px,${60+Math.random()*50}vh) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1400+Math.random()*900,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>e.remove()}}
function countUps(root=document){$$('[data-count]',root).forEach(el=>{const to=+el.dataset.count,f=el.dataset.f||'money',t0=performance.now();const fmt=v=>f==='money'?money(v):f==='dec'?fa(v.toFixed(1)).replace('.','٫'):f==='pct'?fa(Math.round(v))+'٪':fa(Math.round(v));const step=t=>{const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3);el.textContent=fmt(to*e);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}

/* ================= icons ================= */
const IC={
 dash:'<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>',
 inbox:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
 projects:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 inspect:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>',
 report:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
 acc:'<circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.6-.9-1.7-1.5-3-1.5-1.7 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.3 2.2-3 2.2-1.4 0-2.5-.6-3.1-1.6M12 6v2M12 16v2"/>',
 site:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
 access:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 car:'<path d="M5 17h14M6 17l1.5-6h9L18 17M7.5 11l1-3h7l1 3"/><circle cx="8" cy="17.5" r="1.5"/><circle cx="16" cy="17.5" r="1.5"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
 coin:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.7 1.7 0 0 1 0 3.5h-3a1.7 1.7 0 0 0 0 3.5h4"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="M5 12l5 5 9-10"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
 send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',print:'<path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7"/>',
 link:'<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
 wand:'<path d="M15 4l5 5L8 21l-5-5zM14 5l2-2M19 10l2-2"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'
};
const svgi=(k,c='')=>`<svg class="ico ${c}" viewBox="0 0 24 24">${IC[k]}</svg>`;

/* ================= charts (SVG، بدون کتابخانه) ================= */
const COL={p:'#4f6bf0',o:'#f59e0b',g:'#16a34a',r:'#dc2626',y:'#d97706',b:'#38bdf8'};
const LINE='var(--color-base-300)';
let _id=0;
function gauge(v,color,size=130,sub=''){
  const r=size/2-10,c=+(2*Math.PI*r).toFixed(1),h=size/2;
  return `<div class="ch"><svg viewBox="0 0 ${size} ${size}" style="max-width:${size}px;margin:auto"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${LINE}" stroke-width="11"/>
  <circle class="anim" style="--c:${c}" cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${(c*(1-v/100)).toFixed(1)}" transform="rotate(-90 ${h} ${h})"/>
  <text x="${h}" y="${h+(sub?-2:2)}" text-anchor="middle" dominant-baseline="central" style="font-size:${size*.3}px;font-weight:800;fill:var(--color-base-content)">${fa(v)}</text>${sub?`<text x="${h}" y="${h+size*.22}" text-anchor="middle" style="font-size:11px">${sub}</text>`:''}</svg></div>`;
}
function donut(data,size=170,center=''){
  const tot=data.reduce((a,d)=>a+d.v,0)||1,r=size/2-16,c=2*Math.PI*r,h=size/2;let acc=0;
  const seg=data.filter(d=>d.v>0).map(d=>{const len=d.v/tot*c;const s=`<circle class="anim" style="--c:${len}" cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${d.c}" stroke-width="22" stroke-dasharray="${Math.max(len-2,0).toFixed(1)} ${(c-len+2).toFixed(1)}" stroke-dashoffset="${(-acc).toFixed(1)}" transform="rotate(-90 ${h} ${h})"><title>${d.l}: ${fa(Math.round(d.v/tot*100))}٪</title></circle>`;acc+=len;return s}).join('');
  return `<div class="flex flex-wrap items-center gap-4"><div class="ch" style="width:${size}px"><svg viewBox="0 0 ${size} ${size}"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${LINE}" stroke-width="22"/>${seg}${center?`<text x="${h}" y="${h}" text-anchor="middle" dominant-baseline="central" style="font-size:19px;font-weight:800;fill:var(--color-base-content)">${center}</text>`:''}</svg></div>
  <div class="legend flex-col !gap-1.5 !mt-0">${data.map(d=>`<span><i style="background:${d.c}"></i>${d.l} <b>${fa(Math.round(d.v/tot*100))}٪</b></span>`).join('')}</div></div>`;
}
function bars(rows,w=440,h=250,names=['درآمد','سود']){
  const pad={t:14,r:8,b:28,l:34},iw=w-pad.l-pad.r,ih=h-pad.t-pad.b,mx=Math.max(...rows.map(r=>r.a))*1.1,n=rows.length,bw=iw/n;
  const y=v=>pad.t+ih-(v/mx)*ih;
  let g='';for(let i=0;i<=4;i++){const v=mx/4*i,yy=y(v);g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${yy}" y2="${yy}" stroke="${LINE}" stroke-dasharray="3 4"/><text x="${pad.l-6}" y="${yy+4}" text-anchor="end">${fa(Math.round(v))}</text>`}
  const id='gb'+(_id++);
  const b=rows.map((r,i)=>{const cx=w-pad.r-bw*(i+.5),ww=bw*.28;return `<rect class="grow" style="animation-delay:${i*.07}s" x="${cx-ww-2}" y="${y(r.a)}" width="${ww}" height="${pad.t+ih-y(r.a)}" rx="6" fill="url(#${id}a)"><title>${names[0]} ${r.l}: ${fa(r.a)} میلیون</title></rect><rect class="grow" style="animation-delay:${i*.07+.05}s" x="${cx+2}" y="${y(r.b)}" width="${ww}" height="${pad.t+ih-y(r.b)}" rx="6" fill="url(#${id}b)"><title>${names[1]} ${r.l}: ${fa(r.b)} میلیون</title></rect><text x="${cx}" y="${h-8}" text-anchor="middle">${r.l}</text>`}).join('');
  return `<div class="ch"><svg viewBox="0 0 ${w} ${h}"><defs><linearGradient id="${id}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c86ff"/><stop offset="1" stop-color="#2f45b5"/></linearGradient><linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs>${g}${b}</svg></div>
  <div class="legend"><span><i style="background:#3b5bdb"></i>${names[0]}</span><span><i style="background:#f59e0b"></i>${names[1]}</span><span>(میلیون تومان · داده‌ی نمونه)</span></div>`;
}
function line(vals,labels,w=560,h=200,color=COL.p){
  const pad={t:14,r:12,b:26,l:30},iw=w-pad.l-pad.r,ih=h-pad.t-pad.b,mx=Math.max(...vals)*1.15,n=vals.length;
  const X=i=>w-pad.r-iw*(i/(n-1)),Y=v=>pad.t+ih-(v/mx)*ih;
  const pts=vals.map((v,i)=>[X(i),Y(v)]);
  let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=1;i<n;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],m=(x0+x1)/2;d+=` C${m},${y0} ${m},${y1} ${x1},${y1}`}
  const id='gl'+(_id++);

  return `<div class="ch"><svg viewBox="0 0 ${w} ${h}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${g}
  <path d="${d} L${pts[n-1][0]},${pad.t+ih} L${pts[0][0]},${pad.t+ih}Z" fill="url(#${id})"/><path class="anim" style="--c:900" stroke-dasharray="900" stroke-dashoffset="0" d="${d}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round"/>
  ${pts.map((p,i)=>`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--color-base-100)" stroke="${color}" stroke-width="2.5"><title>هفته ${labels[i]}: ${fa(vals[i])} بازدید</title></circle><text x="${p[0]}" y="${h-7}" text-anchor="middle">${labels[i]}</text>`).join('')}</svg></div>`;

function radar(items,size=300){
  const h=size/2,R=h-52,n=items.length;
  const P=(i,f)=>{const a=-Math.PI/2-i*2*Math.PI/n;return [h+Math.cos(a)*R*f,h+Math.sin(a)*R*f]};
  const ring=f=>items.map((_,i)=>P(i,f).join(',')).join(' ');
  const poly=items.map((it,i)=>P(i,Math.max(it.v,3)/100).join(',')).join(' ');
  return `<div class="ch"><svg viewBox="0 0 ${size} ${size}" style="max-width:${size}px;margin:auto">${[.25,.5,.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="${LINE}"/>`).join('')}
  ${items.map((_,i)=>{const [x,y]=P(i,1);return `<line x1="${h}" y1="${h}" x2="${x}" y2="${y}" stroke="${LINE}"/>`}).join('')}
  <polygon points="${poly}" fill="rgba(79,107,240,.22)" stroke="${COL.p}" stroke-width="2.5" stroke-linejoin="round"/>
  ${items.map((it,i)=>{const [x,y]=P(i,1.2),[px,py]=P(i,Math.max(it.v,3)/100);return `<circle class="pt" cx="${px}" cy="${py}" r="4.5" fill="${COL.p}"><title>${it.l}: ${fa(it.v)}</title></circle><text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${it.l}</text>`}).join('')}</svg></div>`;
}
function spark(vals,color,w=84,h=30){
  const mx=Math.max(...vals),mn=Math.min(...vals),n=vals.length;
  const pts=vals.map((v,i)=>`${(w-(i/(n-1))*w).toFixed(1)},${(h-3-((v-mn)/(mx-mn||1))*(h-8)).toFixed(1)}`);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function qr(seed,n=21,px=5){let k=(seed*2654435761)%4294967296||7;const r=()=>{k=(k*1664525+1013904223)%4294967296;return k/4294967296};let s='';
  const fin=(x,y)=>{const cx=x<7?0:x>=n-7?n-7:-1,cy=y<7?0:y>=n-7?n-7:-1;if(cx<0||cy<0||(cx&&cy))return null;const dx=x-cx,dy=y-cy;return dx==0||dx==6||dy==0||dy==6||(dx>=2&&dx<=4&&dy>=2&&dy<=4)};
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){let f=fin(x,y);const on=f===null?r()>.52:f;if(on)s+=`<rect x="${x*px}" y="${y*px}" width="${px}" height="${px}"/>`}
  return `<svg viewBox="0 0 ${n*px} ${n*px}" width="84" height="84" fill="currentColor" aria-label="QR نمونه">${s}</svg>`}

function calc(cl){
  let total=0,cap=false,answered=0;const secs=[];
  SECTIONS.forEach(s=>{let sum=0,n=0;
    s.items.forEach(it=>{const v=cl[it.id];if(v){n++;answered++;sum+=VAL[v];if(it.crit&&v==='bad')cap=true}});

const SERVICES={'۱':['رنگ و بدنه',1500000],'۲':['کارشناسی کامل در محل',4500000],'۳':['کارشناسی VIP با مکانیک',7000000]};
function agentReply(c,text){
  const t=en(text).trim();
  const st=c.state||(c.state={step:'idle',slots:{}});const has=(...w)=>w.some(x=>t.includes(x));
  if(has('انسان','مدیر','شکایت','اپراتور')){st.step='idle';return {text:'متوجه شدم. گفتگو را برای مدیر فرستادم و همکارم به‌زودی پیام می‌دهد.',handoff:true}}
  if(st.step==='idle'){
    if(has('قیمت','تعرفه','هزینه','چنده','چقدر'))return {text:KB.price};
    if(has('منطقه','کجا','شهر','پوشش'))return {text:KB.area};
    if(has('ساعت','زمان','کی ','چه روز'))return {text:KB.time};
    if(has('چطور','بررسی','چه کار','چی'))return {text:KB.how};
    if(has('رزرو','وقت','بازدید','کارشناسی','می‌خوام','میخوام','سلام','درود')){st.step='car';return {text:(has('سلام','درود')?'سلام، به خودروگرافی خوش آمدید 🌟\n':'')+'برای رزرو کارشناسی، لطفاً مدل و سال خودرو را بنویسید. (مثلاً: پژو ۲۰۶ تیپ ۵ مدل ۱۳۹۸)'}}
    return {text:'این سؤال را در دانشم ندارم. گفتگو را به همکار انسانی می‌سپارم تا پاسخ دهد.',handoff:true};
  }
  if(st.step==='car'){st.slots.car=text;st.step='service';return {text:'کدام سرویس؟\n۱) رنگ و بدنه\n۲) کارشناسی کامل در محل\n۳) VIP با مکانیک\n(عدد را بفرستید)'}}
  if(st.step==='service'){const k=Object.keys(SERVICES).find(k=>t.includes(en(k)));if(!k)return {text:'لطفاً عدد ۱، ۲ یا ۳ را بفرستید.'};st.slots.service=SERVICES[k];st.step='place';return {text:'محل بازدید را بنویسید (شهر و محله).'}}
  if(st.step==='place'){st.slots.place=text;st.step='time';return {text:'چه روز و ساعتی مناسب است؟ (مثلاً: پنجشنبه ساعت ۱۰)'}}
  if(st.step==='time'){st.slots.time=text;st.step='name';return {text:'نام و شماره‌ی تماس شما؟'}}
  if(st.step==='name'){
    const ph=(t.match(/09\d{9}/)||[''])[0];const name=t.replace(/09\d{9}/,'').replace(/[،,]/g,'').trim()||'مشتری';const s=st.slots;
    const p=mkProject({cust:name,phone:ph?fa(ph):'۰۹۱۲۰۰۰۰۰۰۰',car:s.car,service:s.service[0],place:s.place,time:s.time,fee:s.service[1],source:c.ch==='tg'?'تلگرام':'واتساپ',summary:`قصد کارشناسی ${s.service[0]} دارد؛ ${s.place}، ${s.time}.`});
    c.projectId=p.id;st.step='idle';st.slots={};
    return {text:`ثبت شد ✅\nپرونده‌ی #${fa(p.id)}\n${p.car} · ${p.service}\n${p.place} · ${p.time}\nتأیید نهایی و نام کارشناس را همکارم پیامک می‌کند.`,created:p.id};
  }
}
function chatSend(cid,txt,done){
  const c=S.chats.find(x=>x.id===cid);if(!c||!txt.trim()||typing)return;
  c.msgs.push({f:'c',t:txt});typing=cid;save();if(page==='inbox'&&chatId===cid)render();
  setTimeout(()=>{const r=agentReply(c,txt);c.msgs.push({f:'a',t:r.text});if(r.handoff)c.handoff=true;if(r.created)toast('پرونده‌ی #'+fa(r.created)+' در ERP ساخته شد');typing=null;save();if(page==='inbox'&&chatId===cid){render();$('#ci')&&$('#ci').focus()}if(done)done(r)},850);
}

   <div class="card border border-base-300 bg-base-100 shadow-sm lg:col-span-2 xl:col-span-1"><div class="card-body gap-3"><h2 class="card-title text-base">پرونده در ERP</h2>${proj?`<div><div class="flex items-center justify-between"><b>#${fa(proj.id)} ${esc(proj.cust)}</b>${sbadge(proj.status)}</div><div class="mt-1 text-sm opacity-80">${esc(proj.car)}<br>${esc(proj.service)}<br>${esc(proj.place)} · ${esc(proj.time)}</div></div><div class="rounded-box bg-secondary/10 p-3 text-sm"><span class="badge badge-secondary badge-sm mb-1">خلاصه‌ی هوشمند</span><br>${esc(proj.summary)}</div><button class="btn btn-soft btn-primary btn-sm" id="op">باز کردن در پروژه‌ها</button>`:'<p class="text-sm opacity-60">هنوز پرونده‌ای ساخته نشده. با رزرو در چت، خودکار ساخته می‌شود.</p>'}

  <div class="mb-4 flex flex-wrap items-center gap-3 noprint"><select id="pp" class="select select-sm max-w-xs">${opts.map(o=>`<option value="${o.id}" ${o.id==p.id?'selected':''}>#${fa(o.id)} · ${esc(o.car)}</option>`).join('')}</select>
   ${tabs([['all','همه‌ی آیتم‌ها'],['todo','بدون پاسخ'],['issue','مشکل‌دارها']],INF,'data-if')}
   <button class="btn btn-soft btn-secondary btn-sm ms-auto" id="fill">${svgi('wand')}پر کردن نمونه (برای دمو)</button></div>
  <div class="grid items-start gap-4 lg:grid-cols-[minmax(0,1fr)_17rem]">
   <div class="space-y-3">${SECTIONS.map(s=>{const r=sc.secs.find(x=>x.s===s),bb=band(r.score),items=s.items.filter(vis);return `<details class="collapse collapse-arrow border border-base-300 bg-base-100 shadow-sm" data-sec="${s.id}" ${openSecs.has(s.id)?'open':''}><summary class="collapse-title flex flex-wrap items-center gap-2 font-bold"><span>${s.name}</span><span class="badge badge-soft badge-primary badge-sm">وزن ${fa(s.w)}٪</span><span class="ms-auto me-8 flex items-center gap-3 text-sm font-normal"><small class="opacity-60">${fa(r.n)}/${fa(s.items.length)}</small><progress class="progress ${bb[4]} w-16" value="${r.score}" max="100"></progress><b class="w-6">${fa(r.score)}</b></span></summary>
     <div class="collapse-content">${items.length?items.map(it=>{const v=p.checklist[it.id];return `<div class="flex flex-wrap items-center gap-2 border-b border-dashed border-base-300 py-2 last:border-0"><span class="min-w-32 flex-1">${it.t} ${it.crit?'<span class="badge badge-error badge-soft badge-xs">حیاتی</span>':''}</span><div class="join tri" data-i="${it.id}">
      <button class="btn btn-xs join-item ${v==='ok'?'btn-success':'btn-ghost border-base-300'}" data-v="ok" ${locked?'disabled':''}>سالم</button><button class="btn btn-xs join-item ${v==='warn'?'btn-warning':'btn-ghost border-base-300'}" data-v="warn" ${locked?'disabled':''}>نیاز به توجه</button><button class="btn btn-xs join-item ${v==='bad'?'btn-error':'btn-ghost border-base-300'}" data-v="bad" ${locked?'disabled':''}>معیوب</button></div></div>`}).join(''):'<div class="py-4 text-center text-sm opacity-60">آیتمی با این فیلتر نیست 🎉</div>'}</div></details>`}).join('')}</div>
   <div class="card sticky-score border border-base-300 bg-base-100 shadow-sm" data-tour="score"><div class="card-body items-center gap-2 text-center">
    <div class="radial-progress ${b[3]}" style="--value:${sc.total};--size:9rem;--thickness:11px" role="progressbar" aria-valuenow="${sc.total}"><span class="text-3xl font-extrabold text-base-content">${fa(sc.total)}</span></div>
    <span class="badge badge-soft badge-${b[1]}">${b[0]}</span>

    <fieldset class="fieldset w-full text-start"><legend class="fieldset-legend">نکات کارشناس</legend><textarea id="nt" class="textarea w-full" rows="3" ${locked?'disabled':''}>${esc(p.notes)}</textarea></fieldset>

  </div>`;

    else submitInspection(p)};
}

function acc(m){
  const list=myProjects(),done=list.filter(p=>p.status==='done'||p.exp.length);
  if(!cur||!done.find(p=>p.id==cur))cur=(done[0]||{}).id;
  const tot=done.reduce((a,p)=>{const f=profit(p);return {i:a.i+f.income,e:a.e+f.exp,n:a.n+f.net}},{i:0,e:0,n:0});
  const byI={};done.forEach(p=>{if(p.insp){const sh=p.exp.filter(e=>e.t==='سهم کارشناس'&&e.ok).reduce((a,e)=>a+e.a,0);byI[p.insp]=(byI[p.insp]||0)+sh}});
  const p=cur&&P_(cur);
  let pd=[];if(p){const f=profit(p);const pal=[COL.p,COL.o,COL.b,COL.y,COL.r];pd=p.exp.filter(e=>e.ok).map((e,i)=>({l:e.t,v:e.a,c:pal[i%5]}));pd.push({l:'سود خالص',v:f.net,c:COL.g})}
  const mg=tot.i?Math.round(tot.n/tot.i*100):0;

  <div class="mt-4 grid gap-4 xl:grid-cols-2">
   <div class="card border border-base-300 bg-base-100 shadow-sm"><div class="card-body"><h2 class="card-title text-base">پروژه‌ها <small class="font-normal opacity-60">(برای جزئیات کلیک کنید)</small></h2><div class="overflow-x-auto"><table class="table table-sm"><thead><tr><th>پرونده</th><th>درآمد</th><th>هزینه</th><th>سود</th><th>حاشیه</th></tr></thead><tbody>${done.map(x=>{const f=profit(x);return `<tr class="cursor-pointer hover:bg-base-200 ${x.id==cur?'bg-primary/10':''}" data-p="${x.id}"><td class="${x.id==cur?'text-primary font-bold':''}">#${fa(x.id)} ${esc(x.cust)}</td><td>${money(f.income)}</td><td>${money(f.exp)}</td><td><b>${money(f.net)}</b></td><td><span class="badge badge-soft badge-sm ${f.margin>=50?'badge-success':f.margin>=30?'badge-warning':'badge-error'}">${fa(f.margin)}٪</span></td></tr>`}).join('')||'<tr><td colspan="5" class="text-center opacity-60 py-6">هنوز پروژه‌ی مالی‌ای نیست</td></tr>'}</tbody></table></div></div></div>

     ${p.exp.map((e,i)=>`<tr><td>${esc(e.t)}</td><td><span class="badge badge-soft badge-error badge-sm">هزینه</span></td><td>${money(e.a)}</td><td>${e.ok?'<span class="text-success">✓</span>':(S.role==='inspector'?'<small class="opacity-60">منتظر تأیید</small>':`<button class="btn btn-success btn-xs" data-ok="${i}">تأیید</button>`)}</td></tr>`).join('')}

     <form id="ef" class="join mt-2 w-full"><input id="et" class="input input-sm join-item flex-[2]" placeholder="شرح هزینه"><input id="ea" type="number" class="input input-sm join-item flex-1" placeholder="مبلغ"><button class="btn btn-primary btn-sm join-item">ثبت</button></form>`:'<p class="opacity-60">پروژه‌ای انتخاب نشده.</p>'}</div></div>
  </div>

  $$('[data-p]',m).forEach(r=>r.onclick=()=>{cur=+r.dataset.p;render()});

  if($('#ef'))$('#ef').onsubmit=e=>{e.preventDefault();const a=+$('#ea').value;if(!$('#et').value||!a)return toast('شرح و مبلغ را وارد کنید','warning');p.exp.push({t:$('#et').value,a,ok:S.role==='inspector'?0:1});save();toast(S.role==='inspector'?'ثبت شد؛ منتظر تأیید مدیر':'هزینه ثبت شد');render()};

  const body=[
   `<fieldset class="fieldset"><legend class="fieldset-legend">مدل و سال خودرو</legend><input id="w_car" class="input w-full" placeholder="مثلاً پژو ۲۰۶ تیپ ۵ مدل ۱۳۹۸" value="${esc(W.car)}"><p class="label">هرچه دقیق‌تر بنویسید، کارشناس بهتر آماده می‌شود.</p></fieldset>`,
   `<div class="grid gap-3">${Object.entries(SERVICES).map(([k,s])=>`<label class="card cursor-pointer border-2 ${W.sv===k?'border-primary bg-primary/5':'border-base-300'} lift"><div class="card-body flex-row items-center gap-3 p-4"><input type="radio" name="sv" class="radio radio-primary" value="${k}" ${W.sv===k?'checked':''}><div class="flex-1"><b>${s[0]}</b><div class="text-xs opacity-70">${k==='۱'?'بررسی بدنه، رنگ و شاسی':k==='۲'?'۸ بخش و ۸۵ آیتم + تست رانندگی':'همراه مکانیک و دیاگ کامل'}</div></div><span class="badge badge-primary badge-soft">${money(s[1])} تومان</span></div></label>`).join('')}</div>`,
   `<div class="grid gap-1 sm:grid-cols-2"><fieldset class="fieldset sm:col-span-2"><legend class="fieldset-legend">محل بازدید</legend><input id="w_place" class="input w-full" placeholder="شهر و محله" value="${esc(W.place)}"></fieldset><fieldset class="fieldset"><legend class="fieldset-legend">زمان مناسب</legend><input id="w_time" class="input w-full" placeholder="مثلاً شنبه ساعت ۱۰" value="${esc(W.time)}"></fieldset><div class="flex flex-wrap items-end gap-1.5 pb-1">${['فردا ۰۹:۰۰','پنجشنبه ۱۰:۰۰','جمعه ۱۶:۰۰'].map(x=>`<button type="button" class="btn btn-xs btn-outline rounded-full wt">${x}</button>`).join('')}</div></div>`,
   `<div class="grid gap-1 sm:grid-cols-2"><fieldset class="fieldset"><legend class="fieldset-legend">نام</legend><input id="w_name" class="input w-full" value="${esc(W.name)}"></fieldset><fieldset class="fieldset"><legend class="fieldset-legend">شماره‌ی تماس</legend><input id="w_phone" class="input w-full" inputmode="tel" placeholder="۰۹۱۲…" value="${esc(W.phone)}"></fieldset></div>
    <div class="rounded-box bg-base-200 p-4 text-sm"><div class="mb-1 font-bold">خلاصه‌ی رزرو</div>${esc(W.car)} · ${SERVICES[W.sv][0]}<br>${esc(W.place)} · ${esc(W.time)}<div class="mt-2 text-lg font-extrabold">${money(SERVICES[W.sv][1])} تومان</div></div>
    <label class="mt-3 flex cursor-pointer items-center gap-3"><input type="checkbox" id="w_pay" class="toggle toggle-primary" ${W.pay?'checked':''}><span class="text-sm">پرداخت آنلاین <span class="badge badge-xs badge-warning">دموی درگاه · پلن حرفه‌ای به بالا</span></span></label>`
  ];
  const doneView=W.done?`<div class="py-6 text-center"><div class="text-6xl">🎉</div><h2 class="mt-2 text-xl font-extrabold">رزرو ثبت شد</h2><p class="opacity-70">پرونده‌ی <b>#${fa(W.done)}</b> ساخته شد${W.pay?' و پرداخت در حسابداری ثبت شد':''}.<br>مدیر آن را در پنل می‌بیند و کارشناس تخصیص می‌دهد.</p><div class="mt-4 flex justify-center gap-2"><button class="btn btn-primary" id="wv">مشاهده در پنل مدیر</button><button class="btn btn-ghost" id="wn">رزرو دیگر</button></div></div>`:'';
  m.innerHTML=head('سایت خودروگرافی · فرم رزرو','نمایی از سایت عمومی؛ رزرو مستقیم وارد پنل مدیر می‌شود.')+`
  <div class="mockup-browser border border-base-300 bg-base-100 mx-auto max-w-2xl shadow-xl"><div class="mockup-browser-toolbar"><div class="input">khodrografi.ir/book</div></div>
   <div><div class="p-6 text-white" style="background:linear-gradient(120deg,#172554,#4f6bf0)"><h2 class="text-2xl font-extrabold">خودروگرافی</h2><div class="text-blue-100">کارشناسی دقیق خودرو، با نمره‌ی ۰ تا ۱۰۰</div></div>
   <div class="p-5 sm:p-7">${W.done?doneView:`<ul class="steps w-full text-xs mb-6">${STEPS.map((s,i)=>`<li class="step ${i<=W.step?'step-primary':''}" data-content="${fa(i+1)}">${s}</li>`).join('')}</ul><div class="fade" key="${W.step}">${body[W.step]}</div>${W.err?`<div role="alert" class="alert alert-error alert-soft mt-3 py-2 text-sm">${W.err}</div>`:''}
    <div class="mt-5 flex justify-between"><button class="btn btn-ghost" id="wb" ${W.step?'':'disabled'}>← قبلی</button><button class="btn btn-primary" id="wx">${W.step===3?'ثبت رزرو':'بعدی →'}</button></div>`}</div></div></div>`;
  const rd=()=>{const g=i=>$('#'+i)?$('#'+i).value.trim():'';if(W.step===0)W.car=g('w_car');if(W.step===2){W.place=g('w_place');W.time=g('w_time')}if(W.step===3){W.name=g('w_name');W.phone=g('w_phone');W.pay=$('#w_pay').checked}};
  if(W.done){$('#wv').onclick=()=>{S.role='manager';$('#role').value='manager';save();PS.q='';PS.f='all';go('projects')};$('#wn').onclick=()=>{Object.assign(W,{step:0,car:'',place:'',time:'',name:'',phone:'',pay:false,done:null,err:''});render()};return}
  $$('input[name=sv]',m).forEach(r=>r.onchange=()=>{W.sv=r.value;render()});
  $$('.wt',m).forEach(b=>b.onclick=()=>{$('#w_time').value=b.textContent});
  $('#wb').onclick=()=>{rd();W.err='';W.step--;render()};
  $('#wx').onclick=()=>{rd();W.err='';
    if(W.step===0&&W.car.length<3)W.err='مدل و سال خودرو را بنویسید.';
    if(W.step===2&&(!W.place||!W.time))W.err='محل و زمان بازدید را وارد کنید.';
    if(W.step===3){if(!W.name)W.err='نام را وارد کنید.';else if(!/^09\d{9}$/.test(en(W.phone)))W.err='شماره‌ی تماس معتبر نیست (مثل ۰۹۱۲۱۲۳۴۵۶۷).'}
    if(W.err)return render();
    if(W.step<3){W.step++;return render()}
    const sv=SERVICES[W.sv];const p=mkProject({cust:W.name,phone:fa(en(W.phone)),car:W.car,service:sv[0],place:W.place,time:W.time,fee:sv[1],source:'سایت',summary:'رزرو از فرم سایت'+(W.pay?' · پرداخت آنلاین موفق (دمو)':'')});
    W.done=p.id;confetti();toast('رزرو #'+fa(p.id)+' ثبت شد');render()};
}

/* ---- دسترسی‌ها ---- */
function access(m){
  const rows=[['مدیر','کامل','تعریف و تخصیص','ویرایش و تأیید','کامل'],['کارشناس','پرونده‌های خودش','تسک‌های خودش','پر کردن چک‌لیست','کارکرد خودش'],['پشتیبان (اختیاری)','پاسخ و پیگیری','مشاهده','مشاهده','—'],['حسابدار (اختیاری)','—','—','—','ثبت و گزارش‌گیری']];
  const R=Object.keys(ROLES);
  m.innerHTML=head('دسترسی‌ها','قابل تنظیم توسط مدیر. نقش را از بالای سایدبار عوض کنید تا اثرش را ببینید.')+`
  <div class="card border border-base-300 bg-base-100 shadow-sm"><div class="card-body"><h2 class="card-title text-base">ماتریس صفحه‌ها × نقش‌ها <span class="badge badge-soft badge-primary badge-sm">زنده</span></h2><div class="overflow-x-auto"><table class="table"><thead><tr><th>صفحه</th>${R.map(r=>`<th class="text-center ${r===S.role?'bg-primary/10 text-primary':''}">${ROLES[r].split(' · ')[0].replace(' (اختیاری)','')}</th>`).join('')}</tr></thead><tbody>${PAGES.map(p=>`<tr><td><span class="inline-flex items-center gap-2">${svgi(p[0])}${p[1]}</span></td>${R.map(r=>`<td class="text-center ${r===S.role?'bg-primary/10':''}">${p[2].includes(r)?'<span class="badge badge-success badge-soft badge-sm">✓</span>':'<span class="opacity-30">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div></div>
  <div class="card mt-4 border border-base-300 bg-base-100 shadow-sm"><div class="card-body"><h2 class="card-title text-base">جزئیات سطح دسترسی</h2><div class="overflow-x-auto"><table class="table table-zebra"><thead><tr><th>نقش</th><th>پیام‌ها و پرونده‌ها</th><th>تسک‌ها</th><th>چک‌لیست و گزارش</th><th>حسابداری</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td>${r.slice(1).map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div></div>`;
}

/* ================= جستجوی سراسری ================= */
function gsOpen(){
  openModal(`<form method="dialog"><button class="btn btn-sm btn-circle btn-ghost absolute top-3 end-3">✕</button></form><label class="input w-full mt-2"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="gq" type="search" placeholder="شماره‌ی پرونده، نام مشتری، خودرو، یا نام یک صفحه…" autocomplete="off"></label><ul class="menu w-full mt-2 max-h-80 overflow-y-auto" id="gr"></ul>`);
  const draw=()=>{const q=en($('#gq').value).trim();
    const pg=PAGES.filter(p=>can(p[0])&&(!q||p[1].includes(q)));
    const pj=S.projects.filter(p=>q&&en([p.id,p.cust,p.car,p.place].join(' ')).includes(q)).slice(0,6);
    $('#gr').innerHTML=(pj.length?'<li class="menu-title">پرونده‌ها</li>'+pj.map(p=>`<li><a data-gp="${p.id}">#${fa(p.id)} · ${esc(p.cust)} <small class="opacity-60">${esc(p.car)}</small><span class="ms-auto">${sbadge(p.status)}</span></a></li>`).join(''):'')+(pg.length?'<li class="menu-title">صفحه‌ها</li>'+pg.map(p=>`<li><a data-gg="${p[0]}">${svgi(p[0])}${p[1]}</a></li>`).join(''):'')||'<li class="p-4 text-center opacity-60">چیزی پیدا نشد</li>';
    $$('[data-gp]',$('#gr')).forEach(a=>a.onclick=()=>{closeModal();projModal(+a.dataset.gp)});
    $$('[data-gg]',$('#gr')).forEach(a=>a.onclick=()=>{closeModal();go(a.dataset.gg)})};
  $('#gq').oninput=draw;draw();$('#gq').focus();
}
$('#gs').onclick=gsOpen;
document.addEventListener('keydown',e=>{const tg=(e.target.tagName||'');if((e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(tg))||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k')){e.preventDefault();gsOpen()}});

/* ================= تور راهنما (سناریوی گام‌به‌گام) ================= */
const TS={on:false,i:0,busy:false,ran:{}};let tourPid=null;
const tourProj=()=>{let p=P_(tourPid);if(!p){p=S.projects.find(x=>x.status==='new')||mkProject({cust:'کیان صالحی',phone:'۰۹۱۲۱۲۳۴۵۶۷',car:'پژو ۲۰۶ تیپ ۵ مدل ۱۳۹۸',service:'کارشناسی کامل در محل',place:'تهران، سعادت‌آباد',time:'پنجشنبه ۱۰:۰۰',fee:4500000,source:'واتساپ',summary:'ساخته‌شده در تور راهنما'});tourPid=p.id}return p};
const TOUR=[
 {page:'dash',role:'manager',hl:'[data-tour=kpi]',t:'پنل مدیر',d:'مدیر همه‌چیز را یک‌جا می‌بیند: درخواست‌های تازه، بازدیدهای امروز، سود و رضایت مشتری. در این تور یک مشتری را از اولین پیام تا گزارش نهایی و حسابداری همراهی می‌کنیم.'},
 {page:'inbox',role:'manager',hl:'[data-tour=chat]',t:'مشتری در واتساپ پیام می‌دهد',d:'ایجنت هوشمند مشتری را راهنمایی می‌کند و بدون دخالت انسان رزرو را در ERP ثبت می‌کند.',run:'شبیه‌سازی گفتگوی مشتری',fn:async()=>{const id=newChat();const c=S.chats.find(x=>x.id===id);c.name='کیان صالحی';c.ch='wa';render();
   for(const t of ['سلام، می‌خوام کارشناسی رزرو کنم','پژو ۲۰۶ تیپ ۵ مدل ۱۳۹۸','۲','تهران، سعادت‌آباد','پنجشنبه ساعت ۱۰','کیان صالحی 09121234567']){await new Promise(res=>chatSend(id,t,r=>{if(r.created)tourPid=r.created;setTimeout(res,650)}))}}},
 {page:'projects',role:'manager',hl:'[data-tour=table]',t:'تخصیص کارشناس',d:'پرونده‌ی تازه با برچسب «درخواست تازه» در بالای لیست است. مدیر با یک کلیک آن را به کارشناس می‌دهد.',run:'تخصیص به علی رضایی',fn:async()=>{tourProj();PS.q='';PS.f='all';assign(tourPid,'ali')}},
 {page:'inspect',role:'inspector',hl:'[data-tour=score]',t:'کارشناس بازدید می‌کند',d:'نقش به «کارشناس» عوض شد. او فقط پرونده‌های خودش را می‌بیند، آیتم‌ها را علامت می‌زند و نمره همزمان حساب می‌شود (آیتم حیاتی معیوب = سقف نمره ۵۹).',run:'پر کردن و ارسال چک‌لیست',fn:async()=>{const p=tourProj();p.checklist=seedChecklist(p.id%50+3);p.status='insp';p.notes='بدنه تمیز؛ تعویض روغن و تسمه‌ی تایم توصیه می‌شود.';save();render();await new Promise(r=>setTimeout(r,900));p.status='review';save();toast('برای تأیید مدیر ارسال شد');render()}},
 {page:'report',role:'manager',hl:'[data-tour=report]',t:'مدیر گزارش را تأیید می‌کند',d:'گزارش با نمره، نمودار راداری و نکات کارشناس آماده است. بعد از تأیید مدیر برای مشتری ارسال می‌شود.',run:'تأیید و ارسال به مشتری',fn:async()=>{const p=tourProj();approve(p);if(!p.exp.length){p.exp=[{t:'سهم کارشناس',a:Math.round(p.fee*.4),ok:1},{t:'رفت‌وآمد',a:400000,ok:1}];save()}confetti();toast('گزارش تأیید و برای مشتری ارسال شد');render()}},
 {page:'acc',role:'manager',hl:'[data-tour=kpi]',t:'حسابداری لحظه‌ای',d:'درآمد، سهم کارشناس و سود خالص همین پرونده خودکار وارد حسابداری شد. 🎉 تور تمام شد؛ حالا خودتان نقش‌ها و صفحه‌ها را امتحان کنید.'}
];
function tourStart(){TS.on=true;TS.i=0;TS.ran={};tourGo(0)}
function tourGo(i){TS.i=i;const s=TOUR[i];S.role=s.role;$('#role').value=s.role;save();if(s.page==='projects'||s.page==='inspect'||s.page==='report'||s.page==='acc'){if(tourPid)cur=tourPid}page=s.page;render();tourPanel()}
function tourPanel(){
  const el=$('#tour'),s=TOUR[TS.i],last=TS.i===TOUR.length-1;
  el.classList.remove('hidden');
  el.innerHTML=`<div class="card border border-secondary bg-base-100 shadow-2xl pop"><div class="card-body gap-2 p-4">
   <div class="flex items-center justify-between"><span class="badge badge-secondary badge-soft">گام ${fa(TS.i+1)} از ${fa(TOUR.length)}</span><button class="btn btn-ghost btn-xs btn-circle" id="tx" aria-label="بستن تور">✕</button></div>
   <progress class="progress progress-secondary w-full" value="${TS.i+1}" max="${TOUR.length}"></progress>
   <h3 class="font-extrabold">${s.t}</h3><p class="text-sm opacity-80">${s.d}</p>
   <div class="mt-1 flex flex-wrap items-center gap-2">${s.run?`<button class="btn btn-secondary btn-sm" id="tr" ${TS.busy||TS.ran[TS.i]?'disabled':''}>${TS.busy?'<span class="loading loading-spinner loading-xs"></span>':TS.ran[TS.i]?'✓':svgi('bolt')} ${TS.ran[TS.i]?'انجام شد':s.run}</button>`:''}
   <span class="ms-auto flex gap-1"><button class="btn btn-ghost btn-sm" id="tp" ${TS.i?'':'disabled'}>قبلی</button><button class="btn ${s.run&&!TS.ran[TS.i]?'btn-ghost':'btn-primary'} btn-sm" id="tn" ${TS.busy?'disabled':''}>${last?'پایان':'بعدی'}</button></span></div></div></div>`;
  $('#tx').onclick=tourEnd;$('#tp').onclick=()=>tourGo(TS.i-1);
  $('#tn').onclick=()=>{if(last){tourEnd();confetti()}else tourGo(TS.i+1)};
  if($('#tr'))$('#tr').onclick=async()=>{TS.busy=true;tourPanel();try{await s.fn()}catch(e){console.error(e)}TS.busy=false;TS.ran[TS.i]=true;tourPanel();tourHL()};
}
function tourHL(){$$('.tour-hl').forEach(e=>e.classList.remove('tour-hl'));const e=$(TOUR[TS.i].hl);if(e){e.classList.add('tour-hl');setTimeout(()=>e.scrollIntoView({behavior:'smooth',block:'center'}),80)}}
function tourEnd(){TS.on=false;$$('.tour-hl').forEach(e=>e.classList.remove('tour-hl'));$('#tour').classList.add('hidden')}
$('#tourbtn').onclick=tourStart;

/* ================= شروع ================= */
/* لینک مستقیم: demo/#inbox یا demo/#report?role=inspector */
function fromHash(){const [h,q]=location.hash.slice(1).split('?');const qs=new URLSearchParams(q||'');const th=qs.get('theme');if(th==='dark'||th==='light')applyTheme(th);const r=qs.get('role');if(r&&ROLES[r]){S.role=r;$('#role').value=r}if(h&&PAGES.find(x=>x[0]===h)){page=h}}
fromHash();addEventListener('hashchange',()=>{fromHash();render()});
render();
try{if(!location.hash&&!localStorage.getItem('khodrografi-welcomed')){localStorage.setItem('khodrografi-welcomed','1');setTimeout(()=>{openModal(`<div class="py-2 text-center"><div class="text-5xl">🚗✨</div><h3 class="mt-2 text-xl font-extrabold">به دموی خودروگرافی خوش آمدید</h3><p class="mt-1 opacity-75">این یک نمونه‌ی کلیکی از سامانه است: ایجنت چت، مدیریت پروژه، چک‌لیست بازدید، گزارش مشتری و حسابداری. همه‌چیز با داده‌ی نمونه کار می‌کند.</p>
   <div class="mt-5 flex flex-col gap-2 sm:flex-row sm:justify-center"><button class="btn btn-secondary" id="wt">${svgi('bolt')}شروع تور ۶ مرحله‌ای (پیشنهادی)</button><button class="btn btn-ghost" onclick="closeModal()">خودم می‌گردم</button></div></div>`);$('#wt').onclick=()=>{closeModal();tourStart()}},500)}}catch(e){}
</script>
